  <title>geo map</title>
  <link rel="stylesheet" type="text/css" href="./styles/index.css">
  <script src="./src/index.js" type="module"></script>
  <style type="text/css"> 
    body {
      margin: 0;
    }

    geo-map {
      color: red;
    }

    .earthquake {
      text-align:center;
      color: black;
    }
  </style>
</head>
<body>

<geo-map id="geo_map"
  id="geo_map"
  accesstoken=pk.eyJ1IjoicmVmbGVjdGl2ZS1lYXJ0aCIsImEiOiJja2VvZHd2YjgwMGJnMnhtcmVsOXRwMWR3In0.KgPtf7QYrYp5g0G2yrvGaA
  styleurl=mapbox://styles/reflective-earth/cl60yqkiw002o16msz3oc2bxb
  latitude= 33.86716840617632
  longitude=-118.12701323464881
  zoom=1
  bearing=0
  pitch=0
  navigation
  geolocate
  geocoder=true
  search-bounds="-118.48176410291592, 33.66337686568919, -117.58037748630301, 34.41894361494393"
>
<geo-json 
  src="https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson" 
  scale="mag"
  color="red"
  opacity="1"
  scale="10"
  id="earthquakes"
  >
<template>
  <div class="earthquake">
    <h1>${mag}</h1>
    <h2>Magnitude</h2>
    <p>${place}</p>
    <friendly-time>${updated}</friendly-time>
  </div>
</template>

<script>
  let radius = 5;
  setInterval(() => {
    geo_map.map.setPaintProperty('earthquakes-layer', 'circle-radius', radius);
    radius = ++radius % 30
  }, 50);


</script>

</geo-json>
