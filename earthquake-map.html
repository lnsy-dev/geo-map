<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vanilla JS / CSS boilerplate for generating JS and CSS libraries in plain CSS, JS, and HTML. Created by LNSY.">
  <meta name="keywords" content="Vanilla JS, CSS, boilerplate, library, LNSY">
  <meta name="author" content="LNSY">
  <meta name="robots" content="index, follow">

  <!-- Open Graph meta tags for better sharing on social media -->
  <meta property="og:title" content="Vanilla JS / CSS boilerplate">
  <meta property="og:description" content="Vanilla JS / CSS boilerplate for generating JS and CSS libraries in plain CSS, JS, and HTML. Created by LNSY.">
  <meta property="og:image" content="./assets/splash.jpg">
  <meta property="og:url" content="https://example.com"> <!-- Replace with your actual URL -->

  <title>geo map</title>
  <link rel="stylesheet" type="text/css" href="./styles/index.css">
  <script src="./src/index.js" type="module"></script>
  <style type="text/css"> 
    body {
      margin: 0;
      background-color:#75CFF1;
    }

    geo-map {
      color: red;
    }

    .earthquake {
      text-align:center;
      color: black;
    }
  </style>
</head>
<body>

<geo-map id="geo_map"
  id="geo_map"
  accesstoken=pk.eyJ1IjoibGluZHNleW15c3NlIiwiYSI6ImNqOGNlYjMzbDA5am8zMmxid2oyc3hrc2cifQ.hK6NXKEl7bK7va2pRtY0Yw
  styleurl=mapbox://styles/lindseymysse/cksmjomi92t7r17mtye09msa6
  latitude=37.83381888486939
  longitude=-122.48369693756104
  zoom=5
  bearing=0
  pitch=15
  >
<geo-json 
  src="https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson" 
  scale="mag"
  color="red"
  opacity="1"
  scale="10"
  id="earthquakes"
  >
<template>
  <div class="earthquake">
    <h1>${mag}</h1>
    <h2>Magnitude</h2>
    <p>${place}</p>
    <friendly-time>${updated}</friendly-time>
  </div>
</template>

</geo-json>

<geo-json
  src="https://gis.conservation.ca.gov/server/rest/services/CGS_Earthquake_Hazard_Zones/SHP_Fault_Zones/MapServer/0/query?outFields=*&where=1%3D1&f=geojson"
  scale="4"
  color="#ff0000"
  opacity="1"
  id="fault-lines"
>

</geo-json>
</geo-map>

</body>
</html>
